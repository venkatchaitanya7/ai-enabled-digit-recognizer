<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.I. Digit Recognizer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      margin: 0;
      min-height: 100vh;
      user-select: none;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0 0 6px 0;
      background: linear-gradient(135deg, #38bdf8 0%, #06b6d4 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
    }
    p.subtitle {
      color: #64748b;
      font-size: 1rem;
      margin: 0 0 24px 0;
    }
    .dashboard {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 280px;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 14px;
    }
    #digitCanvas {
      background: #000000;
      border: 2px solid #334155;
      border-radius: 10px;
      display: block;
      cursor: crosshair;
    }
    .camera-container, .upload-container {
      position: relative;
      width: 280px;
      height: 280px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    #videoFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-reticle {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 220px;
      height: 220px;
      border: 2px dashed #06b6d4;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
      pointer-events: none;
      box-sizing: border-box;
    }
    
    /* Drag & Drop Upload Styles */
    .upload-zone {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
      border: 2px dashed #475569;
      border-radius: 10px;
      transition: all 0.2s ease;
      background: #030712;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: #06b6d4;
      background: rgba(6, 182, 212, 0.05);
    }
    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .upload-text {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    #imagePreview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    #fileInput {
      display: none;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      width: 100%;
    }
    button {
      flex: 1;
      padding: 12px 8px;
      font-size: 0.9rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-action {
      background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    }
    .btn-action:hover {
      box-shadow: 0 6px 16px rgba(6, 182, 212, 0.5);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #1f2937;
      color: #94a3b8;
      border: 1px solid #374151;
    }
    .btn-secondary:hover {
      background: #374151;
      color: #f1f5f9;
    }
    .result-card {
      background: radial-gradient(circle at top, #1e1b4b 0%, #111827 100%);
      border: 1px solid #312e81;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
      justify-content: center;
    }
    .predicted-number {
      font-size: 5.5rem;
      font-weight: 900;
      color: #22d3ee;
      margin: 8px 0;
      text-shadow: 0 0 25px rgba(34, 211, 238, 0.5);
      font-family: monospace;
    }
    .confidence-badge {
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #22d3ee;
    }
    .preview-box {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .preview-box span {
      font-size: 0.75rem;
      color: #64748b;
    }
    #debugCanvas {
      width: 56px;
      height: 56px;
      border: 1px solid #06b6d4;
      border-radius: 4px;
      background: #000;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

  <h1>A.I. DIGIT RECOGNIZER</h1>
  <p class="subtitle">Draw on the canvas, capture a photo, or upload an image file</p>

  <div class="dashboard">
    <!-- 1. Canvas -->
    <div class="card">
      <div class="card-title">✏️ Digital Canvas</div>
      <canvas id="digitCanvas" width="280" height="280"></canvas>
      <div class="button-group">
        <button class="btn-secondary" onclick="resetCanvas()">Clear</button>
        <button class="btn-action" onclick="analyzeCanvas()">Analyze</button>
      </div>
    </div>

    <!-- 2. Camera -->
    <div class="card">
      <div class="card-title">📷 Live Webcam Feed</div>
      <div class="camera-container">
        <video id="videoFeed" autoplay playsinline muted></video>
        <div class="camera-reticle"></div>
      </div>
      <div class="button-group">
        <button class="btn-secondary" id="cameraToggleBtn" onclick="toggleCamera()">Start Cam</button>
        <button class="btn-action" onclick="analyzeCamera()">Analyze</button>
      </div>
    </div>

    <!-- 3. Image Upload -->
    <div class="card">
      <div class="card-title">📤 Upload Image</div>
      <div class="upload-container">
        <div class="upload-zone" id="uploadZone" onclick="triggerFileSelect()">
          <div class="upload-icon" id="uploadIcon">🖼️</div>
          <div class="upload-text" id="uploadText">Click or Drag Image Here<br><span style="font-size: 0.7rem; color: #475569;">PNG, JPG up to 5MB</span></div>
          <img id="imagePreview" alt="Upload Preview">
        </div>
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
      </div>
      <div class="button-group">
        <button class="btn-secondary" onclick="clearUpload()">Clear</button>
        <button class="btn-action" onclick="analyzeUpload()">Analyze</button>
      </div>
    </div>

    <!-- 4. Result Engine -->
    <div class="card result-card">
      <div class="card-title">🔮 Prediction Engine</div>
      <div class="predicted-number" id="outputDigit">-</div>
      <div class="confidence-badge" id="outputConfidence">Confidence: -</div>
      
      <div class="preview-box">
        <span>AI View (Processed):</span>
        <canvas id="debugCanvas" width="28" height="28"></canvas>
      </div>
    </div>
  </div>

  <canvas id="hiddenCanvas" width="280" height="280" style="display:none;"></canvas>

  <script>
    const canvas = document.getElementById("digitCanvas");
    const ctx = canvas.getContext("2d");
    const video = document.getElementById("videoFeed");
    const cameraBtn = document.getElementById("cameraToggleBtn");
    const debugCanvas = document.getElementById("debugCanvas");
    const debugCtx = debugCanvas.getContext("2d");
    const uploadZone = document.getElementById("uploadZone");
    const fileInput = document.getElementById("fileInput");
    const imagePreview = document.getElementById("imagePreview");
    
    let drawing = false;
    let stream = null;
    let uploadedImageBase64 = null;

    function resetCanvas() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 18;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      resetOutputs();
    }
    resetCanvas();

    function resetOutputs() {
      document.getElementById("outputDigit").innerText = "-";
      document.getElementById("outputConfidence").innerText = "Confidence: -";
    }

    // === Canvas Drawing Mechanics ===
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }
    function startDraw(e) {
      drawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }
    function draw(e) {
      if (!drawing) return;
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }
    function stopDraw() { drawing = false; }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", draw);
    window.addEventListener("mouseup", stopDraw);
    canvas.addEventListener("touchstart", (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
    canvas.addEventListener("touchmove", (e) => { e.preventDefault(); draw(e); }, { passive: false });
    canvas.addEventListener("touchend", (e) => { e.preventDefault(); stopDraw(); }, { passive: false });

    // === Camera Integration ===
    async function toggleCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        video.srcObject = null;
        stream = null;
        cameraBtn.innerText = "Start Cam";
      } else {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "environment" }
          });
          video.srcObject = stream;
          cameraBtn.innerText = "Stop Cam";
        } catch (err) {
          console.error("Camera access error:", err);
          alert("Camera access denied or unavailable.");
        }
      }
    }

    // === Image Upload drag/drop ===
    function triggerFileSelect() {
      fileInput.click();
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        processUploadFile(file);
      }
    }

    function processUploadFile(file) {
      if (!file.type.match('image.*')) {
        alert("Please select a valid image file.");
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedImageBase64 = e.target.result;
        imagePreview.src = uploadedImageBase64;
        imagePreview.style.display = "block";
        document.getElementById("uploadIcon").style.display = "none";
        document.getElementById("uploadText").style.display = "none";
      };
      reader.readAsDataURL(file);
    }

    // Drag-over hover indicators
    uploadZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      uploadZone.classList.add("dragover");
    });
    uploadZone.addEventListener("dragleave", () => {
      uploadZone.classList.remove("dragover");
    });
    uploadZone.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadZone.classList.remove("dragover");
      const file = e.dataTransfer.files[0];
      if (file) {
        processUploadFile(file);
      }
    });

    function clearUpload() {
      uploadedImageBase64 = null;
      imagePreview.src = "";
      imagePreview.style.display = "none";
      document.getElementById("uploadIcon").style.display = "block";
      document.getElementById("uploadText").style.display = "block";
      fileInput.value = "";
      resetOutputs();
    }

    // === Prediction Request Transmitter ===
    async function sendPrediction(base64Image, isCamera = false) {
      const outDigit = document.getElementById("outputDigit");
      const outConf = document.getElementById("outputConfidence");
      outDigit.innerText = "...";

      try {
        const res = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64Image, is_camera: isCamera })
        });
        const data = await res.json();
        if (data.error) {
          alert(data.error);
          outDigit.innerText = "-";
          outConf.innerText = "Confidence: -";
        } else {
          outDigit.innerText = data.prediction;
          outConf.innerText = `Confidence: ${data.confidence}`;
          if (data.debug_image) {
            const img = new Image();
            img.onload = () => {
              debugCtx.clearRect(0, 0, 28, 28);
              debugCtx.drawImage(img, 0, 0, 28, 28);
            };
            img.src = data.debug_image;
          }
        }
      } catch (err) {
        console.error(err);
        alert("Failed to communicate with Flask backend!");
        outDigit.innerText = "-";
        outConf.innerText = "Confidence: -";
      }
    }

    function analyzeCanvas() {
      sendPrediction(canvas.toDataURL("image/png"), false);
    }

    function analyzeCamera() {
      if (!stream || video.videoWidth === 0) {
        alert("Please turn on your camera first!");
        return;
      }
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const squareSize = Math.min(vw, vh) * 0.7;
      const startX = (vw - squareSize) / 2;
      const startY = (vh - squareSize) / 2;

      const capCanvas = document.createElement("canvas");
      capCanvas.width = 280;
      capCanvas.height = 280;
      const capCtx = capCanvas.getContext("2d");
      capCtx.drawImage(video, startX, startY, squareSize, squareSize, 0, 0, 280, 280);

      sendPrediction(capCanvas.toDataURL("image/png"), true);
    }

    function analyzeUpload() {
      if (!uploadedImageBase64) {
        alert("Please upload or drag an image first!");
        return;
      }
      // Since uploaded pictures consist of pen strokes on paper background,
      // we run it through the exact same adaptive contrast filter as the camera feed!
      sendPrediction(uploadedImageBase64, true);
    }
  </script>
</body>
</html>
